name: Build theme.css

on:
  push:
    branches:
      - main
      - personal-customization
    paths:
      - "src/**"
      - "package.json"
      - "manifest.json"
      - ".github/workflows/build-theme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Sass
        run: npm install --no-audit --no-fund
      - name: Compile original and personal styles
        run: npm run build
      - name: Verify distributable files
        run: |
          test -s theme.css
          test -s manifest.json
          grep -q "id: personal-options" theme.css
          grep -q "personal-glass-headers" theme.css
      - name: Update compiled CSS if needed
        shell: bash
        run: |
          git add theme.css
          if git diff --cached --quiet; then
            echo "theme.css is up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: refresh theme.css [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
